const BEATS = [
  { a: 0, tint: C.pink, draw(c, t, T) {            // HOOK — no entrance animation: frame 0 is the thumbnail
    const cx = W / 2;
    pill(c, cx - 170, 110, 'TOPIC LABEL', { font: font(700, 30, FJ), fg: C.ink, bg: C.cyan, h: 62, ls: 3 });
    big(c, 'BIG CLAIM', cx, 290, 170, { color: C.white, lw: 24 });
    big(c, 'PUNCHY TWIST', cx, 500, 150, { color: C.yel, lw: 22, rot: -.03, glow: 'rgba(255,225,77,.45)' });
    emo(c, '🤖', cx, 740, 170, { rot: Math.sin(T * 6) * .12 });
  } },
  { a: 2.0, tint: C.cyan, draw(c, t, T) {          // EXAMPLE: card + stamp on the key word

  } },
];

    runBeats(c, T, BEATS);
