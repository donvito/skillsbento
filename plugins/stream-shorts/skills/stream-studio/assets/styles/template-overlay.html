<script>
window.BRAND = __BRAND__;                  // handle, tagline, ring, live from brand.json; colours come from the style
const SPEECH = __SPEECH__;                 // seconds of edited speech
window.REEL_CONFIG = {
  w: 1080, h: 1920, fps: 30, duration: __DUR__, bpm: __BPM__,
  theme: { bg: '#000000', fg: '#ffffff', flash: '#ffffff' },
  fonts: { d: 'Display', b: 'Body', m: 'Mono' },
  fontLoads: ['600 100px "Display"', '600 100px "DisplayIt"', '600 40px "Body"', '500 40px "Body"', '700 30px "Mono"'],

</script>
<script src="engine.js"></script>
<script src="kit.js"></script>
<script>
/* Style "__STYLE__", overlay layout: full-frame camera ('cam'), editorial overlays above the head, captions on the chest.
   Helpers: references/styles.md. Media ids available: __MEDIA__ */
const WORDS = __WORDS__;                   // [word, start, end] of the edit (src/words.json) — drives the word-by-word captions

/* CAPTIONS — sentence case, 1–4 words, *star* the emphasis words (italic + ST.hot). Fix misheard names. */
const CAPS = [
  __CAPS__
];
const HOOK_END = Math.min(2.5, SPEECH * .2);   // the hook already says the first words: captions start after it

const BEATS = [
  { a: 0, draw(c, t, T) {                        // HOOK (frame 0 = thumbnail): cover panel + icons + headline column. Complete at T=0.
    let g = c.createLinearGradient(0, 0, 0, 740); g.addColorStop(0, hexA(ST.card, .97)); g.addColorStop(.72, hexA(ST.card, .93)); g.addColorStop(1, hexA(ST.card, 0));
    c.fillStyle = g; c.fillRect(0, 0, W, 740);
    const icons = ['grok', 'gpt', 'claude'].filter(hasMedia), x0 = icons.length ? 436 : 90;
    if (icons[1]) logo(c, icons[1], 168, 292, 150, { rot: -.17 + Math.sin(T * 2) * .015 });
    if (icons[0]) logo(c, icons[0], 262, 410, 210, { rot: .08 + Math.sin(T * 2.4) * .015, ringCol: 'rgba(255,255,255,.5)' });
    kicker(c, T, -1, 'HOT TAKE', x0 + 110, 107, { light: true, dot: true });
    serif(c, 'Topic', x0, 222, 108, { align: 'left', color: ST.cardInk, halo: false });
    serif(c, 'is the next', x0 + 4, 318, 58, { align: 'left', color: ST.cardDim, halo: false });
    serif(c, 'Big', x0 - 2, 425, 132, { it: true, align: 'left', color: ST.cardInk, halo: false });
    const mw = serif(c, 'claim.', x0 - 2, 548, 132, { it: true, align: 'left', color: ST.cardInk, halo: false });
    scribble(c, x0 + 4, x0 + mw - 12, 622, E.outCubic(P(T, 1.2, 1.6)), ST.accent === ST.ink ? ST.cardInk : ST.accent, 9);
  } },
  { a: HOOK_END, draw(c, t, T) {                 // HEADLINE: serif line + italic word circled on the spoken word
    serif(c, 'It’s happening', W / 2, 120, 92, { alpha: rise(T, HOOK_END).a, dy: rise(T, HOOK_END).dy });
    const r = rise(T, HOOK_END + .5); serif(c, 'again.', W / 2, 270, 168, { it: true, alpha: r.a, dy: r.dy, s: r.s, color: ST.hot });
    ring(c, W / 2, 272, 250, 105, E.outCubic(P(T, HOOK_END + .6, HOOK_END + 1.1)));
  } },
  { a: SPEECH * .4, draw(c, t, T) {              // PAPER CARD: a list that ticks off on the words (illustrative UI)
    const a = SPEECH * .4;
    inn(c, T, a, W / 2, 290, () => {
      paper(c, -450, -235, 900, 470, { r: 34 });
      serif(c, 'Today', -400, -165, 70, { align: 'left', halo: false });
      mono(c, 'KICKER', 400, -162, 20, ST.grey, { align: 'right' });
      [['08:00', 'First thing'], ['10:30', 'Second thing'], ['15:00', 'Third thing']].forEach(([tm, s], i) => {
        const y = -40 + i * 92, t0 = a + .3 + i * .25, tk = a + 1.2 + i * .3, r = rise(T, t0, .35); if (r.a <= 0) return;
        c.save(); c.globalAlpha *= r.a; c.translate(0, r.dy);
        mono(c, tm, -400, y, 26, ST.grey, { ls: 1 }); body(c, s, -250, y, 40, ST.ink, { w: 600 }); tick(c, 370, y, 24, P(T, tk, tk + .22));
        c.restore();
      });
      illus(c, 400, 205);
    }, .45);
  } },
  { a: SPEECH * .65, draw(c, t, T) {             // DARK CARD + REAL FOOTAGE: phone with the demo clip if there is one
    const a = SPEECH * .65;
    if (hasMedia('demo')) { phone(c, T, a, 'demo', t, W / 2, 330, 330, 620); return }
    inn(c, T, a, W / 2, 245, () => {
      dark(c, -450, -190, 900, 380, { r: 34 });
      body(c, 'Working on it…', -400, -119, 38, ST.cardInk, { w: 600 });
      ['Step one', 'Step two', 'Step three'].forEach((s, i) => { const y = -10 + i * 72, t0 = a + .2 + i * .2, t1 = t0 + .7;
        body(c, s, -400, y, 32, ST.cardDim); bar(c, 30, y - 4, 300, 8, P(T, t0, t1), ST.cardInk, 'rgba(255,255,255,.14)'); tick(c, 380, y, 20, P(T, t1, t1 + .2), ST.cardInk, ST.card) });
    }, .45);
  } },
  { a: SPEECH - 2.5, draw(c, t, T) {             // PAYOFF: italic line + underline + marquee
    const a = SPEECH - 2.5, b = rise(T, a + .2);
    const bw = serif(c, 'the payoff line.', W / 2, 200, 124, { it: true, alpha: b.a, dy: b.dy, s: b.s });
    scribble(c, W / 2 - bw / 2 + 20, W / 2 + bw / 2 - 20, 275, E.outCubic(P(T, a + .8, a + 1.2)));
    marquee(c, T, a + .3, 'ONE · TWO · THREE · FOUR · ', 430);
  } },
];

const S = {
  main(c, t, T) {
    bgFill(c, '#000');
    overlayCam(c, T, { punches: [/* [t, .04] on emphasis words */], hook: { until: HOOK_END }, wash: T => clamp((T - HOOK_END + .25) / .4) });
    runOverlay(c, T, BEATS, SPEECH);
    overlayCaptions(c, T, CAPS, WORDS, { hideUntil: HOOK_END });
    overlayHandle(c);
    overlayProgress(c, T, SPEECH);
  },
  end(c, t, T) { overlayEnd(c, t, T, { faceT: SPEECH - .05, start: SPEECH, edu: __EDU__, logos: ['grok', 'gpt', 'claude'].filter(hasMedia) }) },
};

const hits = BEATS.slice(1).map(b => b.a);
Reel.start({
  scenes: [{ name: 'main', start: 0, draw: S.main }, { name: 'end', start: SPEECH, draw: S.end }],
  transitions: [{ type: 'fade', from: 0, to: 1, start: SPEECH - .2, end: SPEECH + .25 }],
  cues: [
    { t: 0, type: 'clip_audio', id: 'face', in: 0, dur: SPEECH, gain: 1, duck: .96 },
    { t: 0, type: 'impact', gain: .45, shake: .08 },
    ...hits.map(t => ({ t: t - .12, type: 'whoosh', dur: .26, gain: .55 })),
    ...hits.map((t, i) => ({ t, type: 'blip', note: 9 + (i % 4) * 2, gain: .4 })),
    { t: SPEECH, type: 'bell', note: 12 }, { t: SPEECH + .3, type: 'bell', note: 14 },
  ],
});
</script></body></html>
